<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="description" content="Explore selected video work from Adclan Media, a creative marketing agency." />
        <title>Video Portfolio | Adclan Media</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: #f5f5f3;
                color: #171717;
                font-family: Arial, sans-serif;
            }

            .site-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-height: 82px;
                padding: 16px max(24px, calc((100% - 1120px) / 2));
                background: #fff;
                border-bottom: 1px solid #e9e9e7;
            }

            .brand {
                display: inline-flex;
                align-items: center;
            }

            .brand img {
                display: block;
                width: 174px;
                height: auto;
            }

            .header-link {
                color: #171717;
                font-size: 14px;
                font-weight: 600;
                text-decoration: none;
            }

            .header-link:hover {
                text-decoration: underline;
                text-underline-offset: 4px;
            }

            .intro {
                max-width: 760px;
                margin: 0 auto;
                padding: 76px 24px 24px;
                text-align: center;
            }

            .eyebrow {
                margin: 0 0 18px;
                color: #757575;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            .intro h1 {
                margin: 0;
                font-size: clamp(36px, 6vw, 60px);
                letter-spacing: -0.055em;
                line-height: 1.05;
            }

            .intro-copy {
                max-width: 560px;
                margin: 20px auto 0;
                color: #666;
                font-size: 17px;
                line-height: 1.65;
            }

            .section {
                padding: 28px 24px 64px;
            }

            .section h2 {
                margin: 0 0 24px;
                text-align: center;
                font-size: 20px;
            }

            .video-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 32px;
                max-width: 1040px;
                margin: 0 auto;
            }

            .video-wrapper {
                position: relative;
                height: 0;
                padding-bottom: 56.25%;
                overflow: hidden;
                border-radius: 12px;
                background: #e7e7e5;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.09);
            }

            .video-wrapper iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }

            .client-credit {
                padding: 0 0 32px;
                text-align: center;
            }

            .client-card {
                max-width: 420px;
                margin: 0 auto;
                padding: 32px 24px;
                border: 1px solid #e9e9e7;
                border-radius: 20px;
                background: #fff;
            }

            .client-label {
                margin: 0 0 12px;
                color: #757575;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            .client-card h2 {
                margin: 0 0 20px;
                font-size: 24px;
            }

            .client-card img {
                display: block;
                width: 144px;
                height: 144px;
                margin: 0 auto;
                border-radius: 16px;
            }

            @media (max-width: 600px) {
                .site-header {
                    min-height: 70px;
                    padding: 14px 20px;
                }

                .brand img {
                    width: 145px;
                }

                .header-link {
                    font-size: 12px;
                }

                .intro {
                    padding-top: 60px;
                }

                .intro-copy {
                    font-size: 15px;
                }

                .section {
                    padding: 24px 16px 40px;
                }

                .video-grid {
                    gap: 22px;
                }

                .client-credit {
                    padding: 32px 16px 48px;
                }
            }
  </style>
    </head>

    <body>

        <header class="site-header">
            <a class="brand" href="https://www.adclan.in/" aria-label="Adclan Media home">
                <img src="assets/adclan-logo.png" alt="Adclan Media" />
            </a>
            <a class="header-link" href="https://www.adclan.in/">Visit adclan.in</a>
        </header>

        <main>
            <section class="intro" aria-labelledby="page-title">
                <p class="eyebrow">Adclan Media | Video Portfolio</p>
                <h1 id="page-title">Ad Film Production</h1>
                <p class="intro-copy">
                    A selection of video work from Adclan Media, bringing brands,
                    products, and stories to life.
                </p>
            </section>

            <section class="section">
                <div class="video-grid">

                    <div class="video-wrapper">

                    <div class="overlay top"></div>
                    <div class="overlay bottom"></div>

                    <iframe width="560" height="315"
                        src="https://www.youtube.com/embed/S8g_fFboKzo?si=AqFg8PaSi_ODxY-l"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>

                    </div>
                    <div class="video-wrapper">

                    <div class="overlay top"></div>
                    <div class="overlay bottom"></div>

                    <iframe width="560" height="315"
                        src="https://www.youtube.com/embed/OnxO2xcAQTU?si=GJrzjA2dwW9Xldnc"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>

                    </div>
                    <div class="video-wrapper">

                    <div class="overlay top"></div>
                    <div class="overlay bottom"></div>

                    <iframe width="560" height="315"
                        src="https://www.youtube.com/embed/ZZE-8g2l0Ek?si=iiQxSOfPGuhDlMht"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>

                    </div>
                    <div class="video-wrapper">

                    <div class="overlay top"></div>
                    <div class="overlay bottom"></div>

                    <iframe width="560" height="315"
                        src="https://www.youtube.com/embed/DjuRqRoFF5E?si=39VFEAzYRFbRv3pX"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>

                    </div>
                </div>
            </section>
        </main>

    </body>
</html>
