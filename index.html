<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Video Sections</title>

        <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .section {
      padding: 40px 20px;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 20px;
    }

   .video-grid {
    display: grid;
    grid-template-columns: 1fr; /* 👈 single column */
    gap: 50px;
    max-width: 1200px;
    margin: auto;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    }

    /* overlays */
    .overlay {
    position: absolute;
    left: 0;
    width: 100%;
    height: 20%;
    background: transparent;
    transition: all 0.3s ease;
    z-index: 2;
    opacity: 0;
    }

    /* top overlay */
    .overlay.top {
    top: 0;
    }

    /* bottom overlay */
    .overlay.bottom {
    bottom: 0;
    }

    /* hover effect */
    .video-wrapper:hover .overlay {
    opacity: 1;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
    </head>

    <body>

        <!-- 🔹 TYPE 1 -->
        <div class="section">
            <h2>Landscape</h2>

            <div class="video-grid">

                <div class="video-wrapper">

                    <div class="overlay top"></div>
                    <div class="overlay bottom"></div>

                    <iframe
                        src="https://www.youtube.com/embed/ROyzDtHpGsM?controls=0&rel=0&modestbranding=1&fs=0&disablekb=1&iv_load_policy=3"
                        title="video"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>

                </div>
                <div class="video-wrapper">

                    <div class="overlay top"></div>
                    <div class="overlay bottom"></div>

                    <iframe width="560" height="315"
                        src="https://www.youtube-nocookie.com/embed/TpRKYVh_pm4?si=i9bmAoVFgti2u4Pu"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>

                </div>
                <div class="video-wrapper">

                    <div class="overlay top"></div>
                    <div class="overlay bottom"></div>

                    <iframe width="560" height="315"

                </div>
                <div class="video-wrapper">

                    <iframe width="560" height="315"

                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>

                </div>
            </div>
        </div>

        <div class="section">
            <h2>Portait</h2>

            <div class="video-grid">

                <div class="video-wrapper">
